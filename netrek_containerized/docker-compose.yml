services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: vanilla-netrek-image
    container_name: vanilla-netrek-server
    ports:
      - "2692:2592"
      - "2693-2729:2593-2629/udp"
    entrypoint: ["/bin/bash", "/opt/netrek/server-entrypoint.sh"]
    volumes:
      - ./docker/server/entrypoint.sh:/opt/netrek/server-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "pgrep", "-f", "netrekd"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  paradise-server:
    build:
      context: ..
      dockerfile: netrek_containerized/docker/paradise-server/Dockerfile
    image: netrek-paradise-server
    container_name: paradise-netrek-server
    ports:
      - "2792:2592"
      - "2791:2591"
      - "2793-2829:2593-2629/udp"
    entrypoint: ["/bin/bash", "/opt/netrek/server-entrypoint.sh"]
    volumes:
      - ./docker/paradise-server/entrypoint.sh:/opt/netrek/server-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "pgrep", "-f", "listen"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
